onsultation for professional-use products. Show the approved main image beside the title. Include unique metadata, canonical, Open Graph, Twitter metadata, Article schema, Breadcrumb schema and visible FAQ plus FAQ schema when useful. Include three to six contextual internal links and reciprocal links. Include Sowena Instagram https://www.instagram.com/sowena_beauty, WhatsApp guidance and Telegram https://t.me/sowenabeauty. External product links may only point to verified official manufacturer or official regional brand pages; record when no official page exists. Update blog/index.html, sitemap.xml, seo-automation/product-seo-queue.csv when applicable, seo-automation/content-calendar-template.csv, seo-automation/sowena-seo-master-tracker.xlsx and seo-automation/seo-100-article-campaign.csv. Increment published_count only after the live article returns HTTP 200, then recompute remaining_articles and next_roadmap_id. Keep the next seven days planned at 20:00 Vietnam time. Validate word count, one H1, local links/assets, JSON-LD, sitemap XML, CSV parsing, desktop/mobile layout and browser console errors. Commit and push GitHub main, wait for Vercel and verify the live article, image and sitemap. Stay quiet when no article is due or state is healthy. Notify only when an article is published, validation fails, all remaining eligible items lack approved images, user action is required, or the campaign completes. When published_count reaches 100, set this automation to PAUSED and notify the user with the final summary."
